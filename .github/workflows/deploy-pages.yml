name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MagicDraft/package-lock.json

      - name: Install dependencies
        working-directory: MagicDraft
        run: npm ci

      - name: Run tests
        working-directory: MagicDraft
        run: npm test -- --run

      - name: Build for GitHub Pages
        working-directory: MagicDraft
        env:
          GITHUB_ACTIONS: 'true'
        run: npm run build

      - name: Prepare Pages artifact
        working-directory: MagicDraft
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: MagicDraft/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
